server: # Server port and ip
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube Support Plugin (For YT Links & Search)
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.5"
    # Spotify Support Plugin
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.3.0"
  server:
    password: "youshallnotpass" 
    # Render-এর UDP ব্লক বাইপাস করার জন্য HTTP টানেলিং অন করা হলো
    httpTunneling:
      enabled: true
    sources:
      youtube: false 
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      channelMix: true
      distortion: true
      lowPass: true
      rotation: true
      timescale: true
      tremolo: true
      vibrato: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

# Plugins Configuration
plugins:
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true 
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      vkmusic: false
    spotify:
      clientId: "YOUR_SPOTIFY_CLIENT_ID" 
      clientSecret: "YOUR_SPOTIFY_CLIENT_SECRET" 
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

  youtube:
    enabled: true
    allowSearch: true 
    allowDirectVideoIds: true 
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - ANDROID

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/Lavalink.log
  level:
    root: INFO
    lavalink: INFO
